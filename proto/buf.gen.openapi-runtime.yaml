version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/staticlabs/statsparrot
plugins:
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.16.2
    out: gen
    opt:
      - logtostderr=true
      - output_format=yaml
      - allow_merge=true,merge_file_name=statsparrot/runtime/v1/runtime
