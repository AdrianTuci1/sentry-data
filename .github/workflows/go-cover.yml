on:
  schedule:
    - cron: "0 5 * * 1,4"
  workflow_dispatch:
name: Go tests with coverage and race detector
jobs:
  test:
    runs-on: ubuntu-22.04-large
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Login to GCR
      uses: docker/login-action@v3
      with:
        registry: gcr.io
        username: _json_key
        password: ${{ secrets.STATSPARROT_BINARY_SA }}
    - name: Restore DuckDB extensions
      id: restore-duckdb-extensions
      uses: actions/cache/restore@v5
      with:
        path: ~/.duckdb/extensions
        key: ${{ runner.os }}-cache-duckdb-extensions
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.5
    - name: Go test with coverage
      run: |-
        # Build list of packages to include in coverage, excluding generated code in 'proto/gen'
        PACKAGES=$(go list ./... | grep -v 'proto/gen/' | tr '\n' ',' | sed -e 's/,$//' | sed -e 's/github.com\/staticlabs\/statsparrot/./g')
        # Run tests with coverage output
        go test ./... -timeout 60m -v -race -covermode=atomic -coverprofile=coverage.out -coverpkg=$PACKAGES
      env:
        STATSPARROT_RUNTIME_TEST_MODE: expensive
        STATSPARROT_RUNTIME_DRUID_TEST_DSN: ${{ secrets.STATSPARROT_RUNTIME_DRUID_TEST_DSN }}
        STATSPARROT_RUNTIME_BIGQUERY_TEST_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.STATSPARROT_RUNTIME_BIGQUERY_TEST_GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        STATSPARROT_RUNTIME_SNOWFLAKE_TEST_DSN: ${{ secrets.STATSPARROT_RUNTIME_SNOWFLAKE_TEST_DSN }}
        STATSPARROT_RUNTIME_GCS_TEST_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.STATSPARROT_RUNTIME_GCS_TEST_GOOGLE_APPLICATION_CREDENTIALS_JSON }}    
        STATSPARROT_RUNTIME_GCS_TEST_HMAC_KEY: ${{ secrets.STATSPARROT_RUNTIME_GCS_TEST_HMAC_KEY }}
        STATSPARROT_RUNTIME_GCS_TEST_HMAC_SECRET: ${{ secrets.STATSPARROT_RUNTIME_GCS_TEST_HMAC_SECRET }}
        STATSPARROT_RUNTIME_S3_TEST_AWS_ACCESS_KEY_ID: ${{ secrets.STATSPARROT_RUNTIME_S3_TEST_AWS_ACCESS_KEY_ID }}
        STATSPARROT_RUNTIME_S3_TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.STATSPARROT_RUNTIME_S3_TEST_AWS_SECRET_ACCESS_KEY }}
        STATSPARROT_RUNTIME_AZURE_TEST_CONNECTION_STRING: ${{ secrets.STATSPARROT_RUNTIME_AZURE_TEST_CONNECTION_STRING }}
        STATSPARROT_RUNTIME_ATHENA_TEST_AWS_ACCESS_KEY_ID: ${{ secrets.STATSPARROT_RUNTIME_S3_TEST_AWS_ACCESS_KEY_ID }}
        STATSPARROT_RUNTIME_ATHENA_TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.STATSPARROT_RUNTIME_S3_TEST_AWS_SECRET_ACCESS_KEY }}
        STATSPARROT_RUNTIME_REDSHIFT_TEST_AWS_ACCESS_KEY_ID: ${{ secrets.STATSPARROT_RUNTIME_S3_TEST_AWS_ACCESS_KEY_ID }}
        STATSPARROT_RUNTIME_REDSHIFT_TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.STATSPARROT_RUNTIME_S3_TEST_AWS_SECRET_ACCESS_KEY }}
        STATSPARROT_RUNTIME_MOTHERDUCK_TEST_PATH: ${{ secrets.STATSPARROT_RUNTIME_MOTHERDUCK_TEST_PATH }}
        STATSPARROT_RUNTIME_MOTHERDUCK_TEST_TOKEN: ${{ secrets.STATSPARROT_RUNTIME_MOTHERDUCK_TEST_TOKEN }}
        STATSPARROT_RUNTIME_DATABRICKS_TEST_DSN: ${{ secrets.STATSPARROT_RUNTIME_DATABRICKS_TEST_DSN }}
        STATSPARROT_TEST_GH_TOKEN: ${{ secrets.STATSPARROT_TEST_GH_TOKEN }}
        STATSPARROT_ADMIN_TEST_GITHUB_APP_ID: ${{ secrets.STATSPARROT_ADMIN_TEST_GITHUB_APP_ID }}
        STATSPARROT_ADMIN_TEST_GITHUB_APP_PRIVATE_KEY: ${{ secrets.STATSPARROT_ADMIN_TEST_GITHUB_APP_PRIVATE_KEY }}
        STATSPARROT_ADMIN_TEST_GITHUB_MANAGED_ACCOUNT: ${{ secrets.STATSPARROT_ADMIN_TEST_GITHUB_MANAGED_ACCOUNT }}
        STATSPARROT_RUNTIME_OPENAI_TEST_API_KEY: ${{ secrets.STATSPARROT_RUNTIME_OPENAI_TEST_API_KEY }}
        STATSPARROT_RUNTIME_GEMINI_TEST_API_KEY: ${{ secrets.STATSPARROT_RUNTIME_GEMINI_TEST_API_KEY }}
    - name: Save DuckDB extensions
      uses: actions/cache/save@v5
      with:
        path: ~/.duckdb/extensions
        key: ${{ steps.restore-duckdb-extensions.outputs.cache-primary-key }}
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.out
        flags: go
    - name: Notify Slack
      uses: ravsamhq/notify-slack-action@v2
      if: always()
      with:
        status: ${{ job.status }}
        notification_title: "{workflow} has {status_message}"
        message_format: "{emoji} *{workflow}*"
        footer: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
        notify_when: failure
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_TEAM_PLATFORM }}
